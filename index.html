<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="辞書を通して、他人の人生をのぞき見るゲーム。">
  <title>MEMORY DICTIONARY</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23ffaa00' stroke-width='4'/%3E%3Cpath d='M2 16h9' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="config.js"></script>
  <script defer src="data.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main id="stage">
    <div id="disc"><div id="disc-rotation"><div id="outer-dial" class="dial"></div><div id="inner-dial" class="dial"></div><div id="markers"></div></div></div>
    <header id="brand">// MEMORY DICTIONARY</header>
    <section id="search-screen">
      <button id="event-text" class="event-text" hidden></button>
      <form id="search-form" novalidate>
        <input id="query" type="text" placeholder="最初の2文字を入力" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="search-button" type="submit"><svg viewBox="0 0 80 80"><circle cx="32" cy="32" r="23"/><path d="m49 49 23 23"/></svg></button>
      </form>
      <p id="search-status"></p>
      <div class="history-area"><h2>検索履歴</h2><div id="history" tabindex="0"></div></div>
    </section>
    <section id="results-screen" hidden inert>
      <div id="entries" tabindex="0"></div>
      <input id="result-scroll" type="range" min="0" max="1000" value="1000">
      <button id="back" type="button"><svg viewBox="0 0 40 70"><path d="M35 5 5 35l30 30"/></svg>戻る</button>
    </section>
    <button id="settings-open" type="button" aria-label="設定"><svg viewBox="1 1 46 46" aria-hidden="true"><g><rect x="20" y="1" width="8" height="12" transform="rotate(0 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(45 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(90 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(135 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(180 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(225 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(270 24 24)"/><rect x="20" y="1" width="8" height="12" transform="rotate(315 24 24)"/></g><path fill-rule="evenodd" d="M24 9a15 15 0 1 0 0 30a15 15 0 1 0 0-30M24 17a7 7 0 1 1 0 14a7 7 0 1 1 0-14"/></svg></button>
    <p id="notice"></p>
  </main>
  <dialog id="settings">
    <h2 id="settings-title">設定</h2>
    <label for="volume">サウンド <output id="volume-value">50%</output></label>
    <input id="volume" type="range" min="0" max="100" value="50">
    <label class="hint-setting" for="hint">ヒント機能<input id="hint" type="checkbox"></label>
    <p>重要なキーワードに色をつける</p>
    <button id="settings-close">閉じる</button>
  </dialog>
  <noscript>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</noscript>
</body>
</html>
