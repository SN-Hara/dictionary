<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辞書検索プロトタイプ</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app">
    <!-- 検索画面 -->
    <section id="search-screen" class="screen is-active" aria-labelledby="search-title">
      <div class="book-panel">
        <h1 id="search-title" class="screen-title">辞書検索</h1>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="search-input">最初の2文字を入力</label>
          <input
            id="search-input"
            class="search-input"
            type="text"
            inputmode="text"
            maxlength="2"
            placeholder="最初の2文字を入力"
            aria-describedby="search-message"
          >
          <button class="search-button" type="submit" aria-label="検索">
            <span aria-hidden="true">⌕</span>
          </button>
        </form>

        <p id="search-message" class="search-message" role="status" aria-live="polite"></p>

        <section class="keyboard-area" aria-label="五十音ソフトウェアキーボード">
          <div id="kana-keyboard" class="kana-keyboard"></div>
          <button id="backspace-button" class="utility-key" type="button">1文字削除</button>
          <button id="clear-button" class="utility-key" type="button">クリア</button>
        </section>

        <section class="history-area">
          <h2>検索履歴</h2>
          <div id="history-list" class="history-list">
            <p class="empty-history">まだ検索履歴はありません。</p>
          </div>
        </section>
      </div>
    </section>

    <!-- 検索結果画面 -->
    <section id="result-screen" class="screen" aria-labelledby="result-title">
      <div class="result-toolbar">
        <button id="back-button" class="back-button" type="button">← 戻る</button>
        <p id="result-query" class="result-query"></p>
      </div>

      <div id="result-scroll" class="result-scroll" tabindex="0">
        <div id="result-content" class="result-content">
          <h1 id="result-title" class="sr-only">検索結果</h1>
        </div>
      </div>
    </section>

    <!-- ページめくり演出 -->
    <div id="page-turn" class="page-turn" aria-hidden="true">
      <div class="page-turn-sheet"></div>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
